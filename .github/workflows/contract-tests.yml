name: Contract Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  consumer-tests:
    name: Consumer Contract Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run consumer tests
      run: npm run test:consumer
      
    - name: Upload pact files
      uses: actions/upload-artifact@v4
      with:
        name: pact-files
        path: pacts/
        
  provider-verification:
    name: Provider Verification
    runs-on: ubuntu-latest
    needs: consumer-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download pact files
      uses: actions/download-artifact@v4
      with:
        name: pact-files
        path: pacts/
        
    - name: Start provider
      run: npm run start:provider &
      
    - name: Wait for provider
      run: npx wait-on http://localhost:8081
      
    - name: Verify contracts
      run: npm run verify:pacts
      
    - name: Publish to Pact Broker (if configured)
      if: env.PACT_BROKER_BASE_URL
      run: npm run publish:pacts
      env:
        PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
        PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
